# Tên của workflow
name: Build and Deploy to Firebase App Hosting

# Workflow này sẽ được kích hoạt khi có code được push lên nhánh `main`
on:
  push:
    branches:
      - main

# Các biến môi trường cần thiết cho việc build và deploy
env:
  # ID dự án Google Cloud của bạn
  PROJECT_ID: studio-4746898573-a49e5
  # Tên của backend trên App Hosting
  BACKEND_ID: unity-codex-backend
  # Khu vực triển khai backend
  LOCATION: us-central1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Cần thiết để xác thực với Google Cloud

    steps:
      # 1. Checkout code từ repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Xác thực với Google Cloud
      # HƯỚNG DẪN CHI TIẾT:
      # Workflow này cần một "chìa khóa" để có quyền triển khai ứng dụng lên Firebase.
      # Bạn cần tạo chìa khóa này trên Google Cloud và đưa nó cho GitHub một cách an toàn.
      #
      # PHẦN A: TẠO CHÌA KHÓA TRÊN GOOGLE CLOUD (SERVICE ACCOUNT)
      #   1. Truy cập Google Cloud Console: https://console.cloud.google.com/
      #   2. Đảm bảo bạn đang chọn đúng dự án (Project ID: ${{ env.PROJECT_ID }}).
      #   3. Tìm kiếm và đi đến trang "IAM & Admin" -> "Service Accounts".
      #   4. Nhấn vào nút "+ CREATE SERVICE ACCOUNT" ở trên cùng.
      #   5. Đặt tên cho Service Account, ví dụ: "github-actions-deployer". Phần "Service account ID" sẽ tự động được tạo. Nhấn "CREATE AND CONTINUE".
      #   6. Trong mục "Grant this service account access to project", tìm và chọn role (vai trò) là "Firebase App Hosting Admin". Nhấn "CONTINUE".
      #   7. Bỏ qua bước 3 (Grant users access to this service account). Nhấn "DONE".
      #   8. Bây giờ bạn sẽ thấy Service Account vừa tạo trong danh sách. Tìm đến nó, nhấn vào biểu tượng 3 chấm ở cột "Actions" và chọn "Manage keys".
      #   9. Nhấn "ADD KEY" -> "Create new key".
      #  10. Chọn "JSON" làm Key type và nhấn "CREATE". Một tệp tin JSON sẽ được tự động tải về máy bạn. **HÃY GIỮ KỸ TỆP NÀY**.
      #
      # PHẦN B: LƯU CHÌA KHÓA VÀO GITHUB (REPOSITORY SECRET)
      #   1. Quay lại trang repository GitHub của bạn.
      #   2. Nhấn vào tab "Settings".
      #   3. Ở menu bên trái, chọn "Secrets and variables" -> "Actions".
      #   4. Nhấn vào nút "New repository secret".
      #   5. Ở ô "Name", nhập chính xác là `GCP_SA_KEY`.
      #   6. Mở tệp JSON bạn vừa tải về ở Phần A. Sao chép TOÀN BỘ nội dung của nó.
      #   7. Dán toàn bộ nội dung đã sao chép vào ô "Secret".
      #   8. Nhấn "Add secret".
      #
      # Sau khi hoàn tất, workflow đã sẵn sàng để hoạt động.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 3. Cài đặt Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Cài đặt các dependencies
      - name: Install dependencies
        run: npm install

      # 5. Build ứng dụng Next.js
      - name: Build application
        run: npm run build

      # 6. Triển khai lên Firebase App Hosting
      - name: Deploy to Firebase App Hosting
        uses: google-github-actions/deploy-app-hosting@v0
        with:
          project_id: ${{ env.PROJECT_ID }}
          backend_id: ${{ env.BACKEND_ID }}
          location: ${{ env.LOCATION }}
